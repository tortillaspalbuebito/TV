name: Compilar APK

on:
  push:
    branches: [main, master]
    paths:
      - index.html
      - manifest.webmanifest
      - "icon-*.png"
      - capacitor.config.json
      - package.json
      - ic_stat_tv.png
      - "*.java"
      - debug.keystore
      - .github/workflows/apk.yml
  workflow_dispatch: {}       # botón "Run workflow" para compilar a mano

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-*.png www/
          GUIA="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/guia.json"
          sed -i "s#</head>#<script>window.TL_APP=true;window.TL_GUIA='${GUIA}';window.TL_VER=${GITHUB_RUN_NUMBER};window.TL_REPO='${GITHUB_REPOSITORY}';</script></head>#" www/index.html

      - name: Instalar Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          # Permitir señales http y avisos a la hora exacta
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /><uses-permission android:name="android.permission.WAKE_LOCK" /><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /></manifest>#' $M
          # Ícono de la app y de las notificaciones
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp icon-192.png $d/ic_launcher.png; cp icon-192.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
          mkdir -p $R/drawable && cp ic_stat_tv.png $R/drawable/ic_stat_tv.png
          # Complemento de pantalla completa
          J=android/app/src/main/java/com/telelibre/app
          mkdir -p $J && cp MainActivity.java PantallaPlugin.java PlayerActivity.java $J/
          # Reproductor nativo de Android (Media3)
          sed -i 's#</application>#<activity android:name=".PlayerActivity" android:exported="false" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" /></application>#' $M
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.media3:media3-exoplayer:1.4.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"\n    implementation "androidx.media3:media3-ui:1.4.1"/' android/app/build.gradle
          grep -n "media3" android/app/build.gradle
          npx cap sync android

      - name: Compilar
        run: |
          # Misma llave en cada compilación, para poder actualizar encima de la versión anterior
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TeleLibre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TeleLibre-apk
          path: TeleLibre.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tele Libre ${{ github.run_number }}
          body: Descarga TeleLibre.apk e instálala en tu Android.
          files: TeleLibre.apk
