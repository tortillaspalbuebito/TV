name: Revisar canales que faltan
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [faltantes.py, .github/workflows/faltantes.yml]
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 faltantes.py
