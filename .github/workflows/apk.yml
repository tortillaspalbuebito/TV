name: Compilar APK

on:
  push:
    branches: [main, master]
    paths:
      - index.html
      - manifest.webmanifest
      - "icon-*.png"
      - capacitor.config.json
      - package.json
      - ic_stat_tv.png
      - .github/workflows/apk.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-*.png www/
          GUIA="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/guia.json"
          sed -i "s#</head>#<script>window.TL_APP=true;window.TL_GUIA='${GUIA}';</script></head>#" www/index.html
      - name: Instalar Capacitor
        run: npm install
      - name: Crear proyecto Android
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /><uses-permission android:name="android.permission.WAKE_LOCK" /></manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp icon-192.png $d/ic_launcher.png; cp icon-192.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
          mkdir -p $R/drawable && cp ic_stat_tv.png $R/drawable/ic_stat_tv.png
          npx cap sync android
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TeleLibre.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeleLibre-apk
          path: TeleLibre.apk
      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tele Libre ${{ github.run_number }}
          body: Descarga TeleLibre.apk e instálala en tu Android.
          files: TeleLibre.apk
