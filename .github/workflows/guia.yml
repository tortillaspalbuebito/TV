name: Actualizar guía de TV

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guia
  cancel-in-progress: false

jobs:
  guia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar guia.json
        run: python3 guia.py guia.json
      - name: Guardar cambios
        run: |
          git config user.name "guia-bot"
          git config user.email "guia-bot@users.noreply.github.com"
          git add guia.json roku.json
          git commit -m "Actualiza guía de TV" || echo "Sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && break
            sleep 5
          done
